function wire(){cc.onmessage=e=>ctl(JSON.parse(e.data));gc.onmessage=e=>{const m=JSON.parse(e.data);if(m.t=='s'&&net=='guest')applySnap(m);else if(m.t=='in'&&net=='host'){for(const k of['l','r','d','h','uh'])rin[k]=m[k];for(const k of['u','a','s','hp','ul'])rin[k]|=m[k]}}}
function mkHost(){net='host';mkpc();cc=pc.createDataChannel('c');gc=pc.createDataChannel('g',{ordered:false,maxRetransmits:0});wire()}
function nJoin(){net='guest';mkpc();pc.ondatachannel=e=>{if(e.channel.label=='c')cc=e.channel;else gc=e.channel;if(cc&&gc)wire()};ns.textContent="Paste the host's code on the right, press Connect, then send the reply code back."}
const ice=()=>new Promise(r=>{if(pc.iceGatheringState=='complete')return r();pc.onicegatheringstatechange=()=>pc.iceGatheringState=='complete'&&r();setTimeout(r,5000)}),enc=d=>btoa(JSON.stringify(d)),dec=s=>JSON.parse(atob(s.trim()));
async function nHost(){mkHost();await pc.setLocalDescription(await pc.createOffer());await ice();n1.value=enc(pc.localDescription);ns.textContent='Send the left code to your friend, paste their reply on the right, press Connect.'}
async function nConn(){try{await pc.setRemoteDescription(dec(n2.value));if(net=='guest'){await pc.setLocalDescription(await pc.createAnswer());await ice();n1.value=enc(pc.localDescription);ns.textContent='Send the left code back to the host.'}}catch(e){ns.textContent='Bad code: '+e.message}}
function room(){const code=document.getElementById('rc').value||'room1',ws=new WebSocket(WS_URL),tx=m=>ws.send(JSON.stringify(m));let q=Promise.resolve();
 ws.onopen=()=>tx({j:code});
 ws.onmessage=e=>{q=q.then(async()=>{const m=JSON.parse(e.data);
  if(m.full)ns.textContent='Room full';
  else if(m.role=='host'){mkHost();pc.onicecandidate=v=>v.candidate&&tx({c:v.candidate});ns.textContent='Waiting for a friend in room '+code+'...'}
  else if(m.role=='guest'){nJoin();pc.onicecandidate=v=>v.candidate&&tx({c:v.candidate})}
  else if(m.peer){await pc.setLocalDescription(await pc.createOffer());tx({d:pc.localDescription})}
  else if(m.d){await pc.setRemoteDescription(m.d);if(m.d.type=='offer'){await pc.setLocalDescription(await pc.createAnswer());tx({d:pc.localDescription})}}
  else if(m.c)try{await pc.addIceCandidate(m.c)}catch(_){}})}}
let last=performance.now(),acc=0;
function loop(n){acc+=Math.min(100,n-last);last=n;let s=0;
 while(acc>=16.67){acc-=16.67;if(net=='guest')gsend();else{tick();if(net=='host'){rin.u=rin.a=rin.s=rin.hp=rin.ul=0;if(gc&&gc.readyState=='open')gc.send(snap())}}for(const k in P)delete P[k]}
 draw();requestAnimationFrame(loop)}
show(0);mark();start();mn.style.display='';requestAnimationFrame(loop);
</script></body></html>
